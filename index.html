<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF0F5;--surface:#FFFFFF;--ink:#16263A;--muted:#5F7186;--line:#D3DDE7;--accent:#0E8A8C;--accent-ink:#FFFFFF;--streak:#E8962E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B29;--surface:#172636;--ink:#E7EEF5;--muted:#93A5B8;--line:#27394D;--accent:#35B6B8;--accent-ink:#0F1B29;--streak:#F2A541}}
:root[data-theme="dark"]{--bg:#0F1B29;--surface:#172636;--ink:#E7EEF5;--muted:#93A5B8;--line:#27394D;--accent:#35B6B8;--accent-ink:#0F1B29;--streak:#F2A541}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:2rem;line-height:1.1;margin:0 0 4px}
.date{color:var(--muted);margin:0 0 20px}
.today{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:20px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .t{stroke:var(--line)}
.ring .p{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .35s ease}
.today b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.25rem;display:block}
.today span{color:var(--muted);font-size:.95rem}
form.add{display:flex;gap:8px;margin-bottom:20px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
.habit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:12px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.name{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.streak{color:var(--streak);font-weight:700;white-space:nowrap;font-size:.95rem}
.streak.zero{color:var(--muted);font-weight:500}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--muted)}
.day button{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--accent-ink);font-size:1.1rem;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
.day button.on{background:var(--accent);border-color:var(--accent)}
.day.now span{color:var(--ink);font-weight:700}
.del{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;padding:8px 0 0;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:16px}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:10px}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.hd{text-align:center;color:var(--muted);font-size:.75rem}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:.8rem;cursor:pointer}
.cell.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.acts{display:flex;gap:18px}
.mic{padding:12px 14px}
.mic.live{background:var(--streak)}
.voice{min-height:1.3em;color:var(--muted);font-size:.9rem;margin:-10px 0 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Habit tracker</h1>
  <p class="date" id="date"></p>
  <section class="today" aria-live="polite">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="t" cx="32" cy="32" r="26"/><circle class="p" id="ring" cx="32" cy="32" r="26" stroke-dasharray="163.36" stroke-dashoffset="163.36"/></svg>
    <div><b id="sumA">0 of 0 done today</b><span id="sumB">Add a habit to get started.</span></div>
  </section>
  <form class="add" id="form">
    <input id="name" type="text" maxlength="60" placeholder="New habit, like ‘Drink water’" aria-label="New habit name" autocomplete="off">
    <button class="btn mic" type="button" id="mic" aria-label="Voice command">🎤</button>
    <button class="btn" type="submit">Add habit</button>
  </form>
  <p class="voice" id="voice" aria-live="polite"></p>
  <div id="list"></div>
</main>
<script>
(function(){
var KEY='habit-tracker-v1', habits=[];
try{var raw=localStorage.getItem(KEY); if(raw) habits=JSON.parse(raw)||[];}catch(e){habits=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(habits));}catch(e){}}
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function back(n){var d=new Date();d.setDate(d.getDate()-n);return d;}
function streak(h){var n=h.days[dk(back(0))]?0:1,c=0;while(h.days[dk(back(n))]){c++;n++;}return c;}
var names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],open={};
function wk7(h){var c=0;for(var i=0;i<7;i++)if(h.days[dk(back(i))])c++;return c;}
function best(h){var ks=Object.keys(h.days).sort(),run=0,max=0,prev=null;ks.forEach(function(k){var d=new Date(k+'T00:00:00');run=(prev&&Math.round((d-prev)/864e5)===1)?run+1:1;if(run>max)max=run;prev=d;});return max;}
function hist(h){var s=new Date();s.setDate(s.getDate()-34);s.setDate(s.getDate()-s.getDay());var t=dk(back(0)),o='<div class="hist">';names.forEach(function(n){o+='<span class="hd">'+n.charAt(0)+'</span>';});for(var d=new Date(s);dk(d)<=t;d.setDate(d.getDate()+1)){var k=dk(d),on=h.days[k];o+='<button type="button" class="cell'+(on?' on':'')+'" data-id="'+h.id+'" data-k="'+k+'" aria-pressed="'+(!!on)+'" aria-label="'+d.toDateString()+'">'+d.getDate()+'</button>';}return o+'</div>';}
document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function render(){
  var list=document.getElementById('list'),today=dk(back(0)),done=0;
  list.innerHTML='';
  if(!habits.length){list.innerHTML='<div class="empty">No habits yet. Type one above and tap Add habit.</div>';}
  habits.forEach(function(h){
    if(h.days[today])done++;
    var s=streak(h),el=document.createElement('div');el.className='habit';
    var days='';
    for(var i=6;i>=0;i--){var d=back(i),k=dk(d),on=h.days[k];
      days+='<div class="day'+(i===0?' now':'')+'"><button type="button" data-id="'+h.id+'" data-k="'+k+'" class="'+(on?'on':'')+'" aria-pressed="'+(!!on)+'" aria-label="'+names[d.getDay()]+' '+d.getDate()+'">'+(on?'✓':'')+'</button><span>'+names[d.getDay()]+'</span></div>';}
    el.innerHTML='<div class="head"><span class="name"></span><span class="streak'+(s?'':' zero')+'">'+(s?s+(s===1?' day':' days')+' in a row':'No streak yet')+'</span></div><div class="days">'+days+'</div><div class="stats"><span>'+wk7(h)+' of 7 this week</span><span>Best streak: '+best(h)+(best(h)===1?' day':' days')+'</span></div>'+(open[h.id]?hist(h):'')+'<div class="acts"><button type="button" class="del" data-hist="'+h.id+'">'+(open[h.id]?'Hide history':'Show 5-week history')+'</button><button type="button" class="del" data-del="'+h.id+'">Delete habit</button></div>';
    el.querySelector('.name').textContent=h.name;
    list.appendChild(el);
  });
  var t=habits.length;
  document.getElementById('sumA').textContent=done+' of '+t+' done today';
  document.getElementById('sumB').textContent=!t?'Add a habit to get started.':done===t?'All done. Nice work today.':(t-done)+' left to check off.';
  document.getElementById('ring').style.strokeDashoffset=163.36*(1-(t?done/t:0));
}
document.getElementById('list').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){var h=habits.find(function(x){return x.id===b.dataset.id;});if(h){if(h.days[b.dataset.k])delete h.days[b.dataset.k];else h.days[b.dataset.k]=1;save();render();}}
  else if(b.dataset.hist){open[b.dataset.hist]=!open[b.dataset.hist];render();}
  else if(b.dataset.del){var h2=habits.find(function(x){return x.id===b.dataset.del;});if(h2&&confirm('Delete “'+h2.name+'”? Its history will be removed.')){habits=habits.filter(function(x){return x.id!==b.dataset.del;});save();render();}}
});
document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();var i=document.getElementById('name'),v=i.value.trim();if(!v)return;
  habits.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:v,days:{}});
  i.value='';save();render();
});
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=document.getElementById('mic'),vs=document.getElementById('voice');
if(!SR){mic.hidden=true;}else{
  var rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=false;rec.maxAlternatives=1;
  var say=function(m){vs.textContent=m;};
  var find=function(q){q=q.toLowerCase().trim();return habits.find(function(h){return h.name.toLowerCase()===q;})||habits.find(function(h){var n=h.name.toLowerCase();return n.indexOf(q)>-1||q.indexOf(n)>-1;});};
  rec.onresult=function(e){
    var t=e.results[0][0].transcript.trim().replace(/[.!?]+$/,''),m,today=dk(back(0));
    if((m=t.match(/^(?:add|new|create)(?: a)?(?: new)? habit(?: called| named)?\s+(.+)$/i))||(m=t.match(/^add\s+(.+)$/i))){
      var n=m[1].trim();n=n.charAt(0).toUpperCase()+n.slice(1);
      habits.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:n,days:{}});save();render();say('Added “'+n+'”.');
    }else if((m=t.match(/^(?:check off|check|mark|complete|finished|done)\s+(.+?)(?: as done| done)?$/i))){
      var h=find(m[1]);if(h){h.days[today]=1;save();render();say('Checked off “'+h.name+'” for today.');}else say('No habit matches “'+m[1]+'”.');
    }else if((m=t.match(/^(?:uncheck|undo|unmark)\s+(.+)$/i))){
      var u=find(m[1]);if(u){delete u.days[today];save();render();say('Unchecked “'+u.name+'” for today.');}else say('No habit matches “'+m[1]+'”.');
    }else say('Heard “'+t+'”. Try “add habit read”, “check off read”, or “uncheck read”.');
  };
  rec.onerror=function(e){say(e.error==='not-allowed'||e.error==='service-not-allowed'?'Microphone access is blocked. Allow it in your browser settings, then try again.':'Voice input failed. Tap the mic and try again.');};
  rec.onend=function(){mic.classList.remove('live');};
  mic.addEventListener('click',function(){try{rec.start();mic.classList.add('live');say('Listening…');}catch(err){}});
}
render();
})();
</script>
</body>
</html>
